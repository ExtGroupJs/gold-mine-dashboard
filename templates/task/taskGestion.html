{% extends "index.html" %}
{% load static %}
{% load i18n %}

{% block head-extra %}
<link rel="stylesheet" href="{% static 'assets/dist/css/adminlte.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/plugins/datatables-responsive/css/responsive.bootstrap4.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/plugins/datatables-buttons/css/buttons.bootstrap4.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/plugins/select2/css/select2.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css' %}">
<style>
  /* Task row status colors */
  .task-status-started td { background-color: #fff3cd !important; } /* orange-ish */
  .task-status-completed td { background-color: #d4edda !important; } /* green-ish */
  .task-status-notstarted td { background-color: #f8d7da !important; } /* red-ish */
</style>
{% endblock %}

{% block content %}

<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
  <!-- Content Header (Page header) -->
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1>Tareas</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
            <li class="breadcrumb-item active">Modelos</li>
          </ol>
        </div>
      </div>
    </div><!-- /.container-fluid -->
  </section>

  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">



          <div class="card">
            <div class="card-header">

              <h3 class="card-title">Gestionar Tareas</h3>
              <div class="card-tools">
                <form id="task-filters" class="form-inline">
                  <div class="form-group mr-2">
                    <label class="mr-1">Inicio desde</label>
                    <input type="date" id="start_from" class="form-control form-control-sm" />
                  </div>
                  <div class="form-group mr-2">
                    <label class="mr-1">Inicio hasta</label>
                    <input type="date" id="start_to" class="form-control form-control-sm" />
                  </div>
                  <div class="form-group mr-2">
                    <label class="mr-1">Fin desde</label>
                    <input type="date" id="end_from" class="form-control form-control-sm" />
                  </div>
                  <div class="form-group mr-2">
                    <label class="mr-1">Fin hasta</label>
                    <input type="date" id="end_to" class="form-control form-control-sm" />
                  </div>
                  <button type="button" id="btn-filter-dates" class="btn btn-primary btn-sm mr-1">Filtrar</button>
                  <button type="button" id="btn-clear-filters" class="btn btn-secondary btn-sm">Limpiar</button>
                </form>
              </div>
            </div>
            <!-- /.card-header -->
            <div class="modal-body">

              <!-- </div>style="overflow: hidden;"> -->
              <table id="tabla-de-Datos" class="table table-bordered table-striped" style="width: 100%;">

              </table>
            </div>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
        <!-- /.col -->
      </div>
      <!-- /.row -->
    </div>
    <!-- /.container-fluid -->
  </section>
  <!-- /.content -->
</div>
<!-- /.content-wrapper -->


<!-- /.modal-dialog -->
</div>
<!-- /.modal -->

<!-- Modal para asignar responsables y fecha de inicio -->
<div class="modal fade" id="modal-assign-task" tabindex="-1" role="dialog" aria-labelledby="assignLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <form id="form-assign-task">
        <div class="modal-header">
          <h5 class="modal-title" id="assignLabel">Asignar responsable / Iniciar</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="assign_roles">Rol</label>
            <select id="assign_roles" class="form-control select2" style="width:100%" data-placeholder="Selecciona un rol"></select>
          </div>
          <div class="form-group">
            <label for="assign_start_date">Fecha y hora inicio</label>
            <input id="assign_start_date" type="datetime-local" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary">Asignar e Iniciar</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
{% block script %} <!-- DataTables & Plugins -->
<script src="{% static 'assets/plugins/datatables/jquery.dataTables.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-responsive/js/dataTables.responsive.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-responsive/js/responsive.bootstrap4.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-buttons/js/dataTables.buttons.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-buttons/js/buttons.bootstrap4.min.js' %}"></script>
<script src="{% static 'assets/plugins/jszip/jszip.min.js' %}"></script>
<script src="{% static 'assets/plugins/pdfmake/pdfmake.min.js' %}"></script>
<script src="{% static 'assets/plugins/pdfmake/vfs_fonts.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-buttons/js/buttons.html5.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-buttons/js/buttons.print.min.js' %}"></script>
<script src="{% static 'assets/plugins/datatables-buttons/js/buttons.colVis.min.js' %}"></script>
<script src="{% static 'assets/plugins/bs-custom-file-input/bs-custom-file-input.min.js' %}"></script>
<script src="{% static 'assets/plugins/jquery-validation/jquery.validate.min.js' %}"></script>
<script src="{% static 'assets/plugins/jquery-validation/additional-methods.min.js' %}"></script>
<script src="{% static 'assets/plugins/jquery-validation/localization/messages_es.js' %}"></script>
<script src="{% static 'assets/dist/js/axios.min.js' %}"></script>

<script src="{% static 'assets/dist/js-mine/task.js' %}"></script>
<script src="{% static 'assets/plugins/select2/js/select2.full.min.js' %}"></script>

<!-- Page specific script -->


{% endblock %}
